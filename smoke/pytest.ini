# Smoke suite config. Kept separate from the root pyproject so framework
# deprecation warnings don't turn into errors (root sets filterwarnings=error)
# and so `pytest` from the repo root never collects these.
[pytest]
addopts = -ra --strict-markers -p no:cacheprovider
markers =
    offline: Tier 1 — real framework, fake LLM, mocked Beacon. No credentials.
    live: Tier 2 — scripted LLM, real dev Beacon. Needs SMOKE_LIVE=1 + Beacon credentials.
    langgraph: LangGraph adapter
    claude: Claude Agent SDK adapter
    adk: Google ADK adapter
    openai: OpenAI Agents SDK adapter
    foundry: Microsoft Agent Framework (Foundry) adapter
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
