[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agentic-context-claude"
version = "0.7.0"
description = "Claude Agent SDK adapter for agent-context-sdk."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Salesforce Public Code License (see the root LICENSE.txt)" }
authors = [{ name = "Agentic Context Maintainers" }]
keywords = ["claude", "agent", "memory", "ingestion"]
# Not published. The root `agent-context-sdk` wheel is the sole distribution and
# vendors this adapter (no per-framework extras). Retained for local
# `pip install -e` dev/test only; the classifier makes twine refuse an upload.
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "agent-context-sdk>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    # Pin the real SDK so test_on_demand_tool's skipif is never reached in CI —
    # those tests are the only coverage for the on-demand recall tool (the
    # default retrieval path), so a missing SDK must fail loudly, not skip green.
    "claude-agent-sdk>=0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_context_claude"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Shared adapter contract tests (repo-root, never packaged).
pythonpath = ["../../contract_tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py39"
