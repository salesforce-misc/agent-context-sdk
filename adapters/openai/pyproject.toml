[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agentic-context-openai"
version = "0.7.0"
description = "OpenAI (Agents SDK + Chat Completions) adapter for agent-context-sdk."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Salesforce Public Code License (see the root LICENSE.txt)" }
authors = [{ name = "Agentic Context Maintainers" }]
keywords = ["openai", "agents", "memory", "ingestion"]
# Not published. The root `agent-context-sdk` wheel is the sole distribution and
# vendors this adapter. Retained for local `pip install -e` dev/test only;
# the classifier makes twine refuse an upload.
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "agent-context-sdk>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    # Pin the real SDK so make_context_retrieval_tool coverage runs. The pure
    # ingestion path (snapshot/push/ingest) does NOT need the SDK, so pure
    # test modules can run without it; the recall-tool tests are the only
    # coverage that would skip if the SDK were missing. Floor is 0.3 because
    # earlier versions ship RunHooks without on_llm_start / on_llm_end — the
    # streaming path would silently drop every assistant turn against those.
    "openai-agents>=0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_context_openai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Shared adapter contract tests (repo-root, never packaged).
pythonpath = ["../../contract_tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
